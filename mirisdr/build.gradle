plugins {
    id 'com.android.library'
}
android {
    namespace 'com.railfan.lbj.mirisdr'
    compileSdk 34
    ndkVersion "26.1.10909125"
    defaultConfig {
        minSdk 26
        targetSdk 34
        // 和主 App 一致：只出 arm64（Chaquopy 运行时也只有 arm64/x86_64）
        ndk { abiFilters "arm64-v8a" }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}
